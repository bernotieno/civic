version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: civicai_db
    env_file: .env.production
    environment:
      POSTGRES_DB: ${DB_NAME:-civicai_db}
      POSTGRES_USER: ${DB_USER:-civicai_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "127.0.0.1:5432:5432"  # Only accessible from localhost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-civicai_user} -d ${DB_NAME:-civicai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - civicai-network

  redis:
    image: redis:7-alpine
    container_name: civicai_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"  # Only accessible from localhost
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - civicai-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicai_web
    command: gunicorn
    env_file: .env.production
    environment:
      - DJANGO_SETTINGS_MODULE=civicAI.settings.production
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
      - frontend_volume:/app/frontend-build
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - civicai-network

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicai_celery
    command: celery
    env_file: .env.production
    environment:
      - DJANGO_SETTINGS_MODULE=civicAI.settings.production
    volumes:
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - civicai-network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicai_celery_beat
    command: celery-beat
    env_file: .env.production
    environment:
      - DJANGO_SETTINGS_MODULE=civicAI.settings.production
    volumes:
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - civicai-network

  nginx:
    image: nginx:alpine
    container_name: civicai_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - frontend_volume:/app/frontend-build:ro
      - ./docker/ssl:/etc/nginx/ssl:ro  # SSL certificates
      - ./docker/nginx-logs:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - civicai-network

  # Optional: Monitoring with Watchtower for auto-updates
  watchtower:
    image: containrrr/watchtower
    container_name: civicai_watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 3600 --cleanup --include-restarting
    restart: unless-stopped
    profiles: ["monitoring"]

  # Optional: Database backup service
  backup:
    image: postgres:15-alpine
    container_name: civicai_backup
    env_file: .env.production
    volumes:
      - ./backups:/backups
      - postgres_data:/var/lib/postgresql/data:ro
    command: >
      sh -c "
      while true; do
        pg_dump -h db -U ${DB_USER:-civicai_user} -d ${DB_NAME:-civicai_db} -f /backups/backup_$$(date +%Y%m%d_%H%M%S).sql
        find /backups -name '*.sql' -mtime +7 -delete
        sleep 86400
      done
      "
    depends_on:
      - db
    restart: unless-stopped
    profiles: ["backup"]
    networks:
      - civicai-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  logs_volume:
    driver: local
  frontend_volume:
    driver: local

networks:
  civicai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16