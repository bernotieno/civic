# =============================================================================
# CivicAI FREE TIER RENDER DEPLOYMENT
# Note: Free tier has limitations - services sleep after 15min inactivity
# =============================================================================

services:
  # =============================================================================
  # CivicAI Backend Service (Django with embedded Celery)
  # =============================================================================
  - type: web
    name: civicai-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "python start_server.py"
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: civicai-backend.onrender.com,civicai-frontend.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://civicai-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: civicai-postgres
          property: connectionString
      - key: REDIS_URL
        value: redis://red-free-redis-url:6379  # You'll need to get this from Redis provider
      - key: CELERY_BROKER_URL
        value: redis://red-free-redis-url:6379
      - key: CELERY_RESULT_BACKEND
        value: redis://red-free-redis-url:6379
      - key: OPENAI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: CLAUDE_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: EMAIL_HOST_USER
        sync: false  # Set manually in Render dashboard
      - key: EMAIL_HOST_PASSWORD
        sync: false  # Set manually in Render dashboard
      - key: CIVICAI_FREE_TIER
        value: true
      - key: CELERY_WORKER_CONCURRENCY
        value: 2

  # =============================================================================
  # CivicAI Frontend Service (React/Vite)
  # =============================================================================
  - type: web
    name: civicai-frontend
    env: node
    buildCommand: "npm ci && npm run build"
    startCommand: "npm run preview -- --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: VITE_API_BASE_URL
        value: https://civicai-backend.onrender.com
      - key: VITE_WS_BASE_URL
        value: wss://civicai-backend.onrender.com

# =============================================================================
# Database Services (FREE TIER)
# =============================================================================
databases:
  - name: civicai-postgres
    databaseName: civicai_db
    user: civicai_user
    plan: free
    postgresMajorVersion: 15