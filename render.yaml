services:
  # Backend Django API
  - type: web
    name: civicai-backend
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn civicAI.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: civicAI.settings.production
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: civicai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: civicai-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: civicai-backend.onrender.com,civicai.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://civicai.onrender.com,https://civicai-frontend.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: true
      - key: TIME_ZONE
        value: Africa/Nairobi
    disk:
      name: civicai-media
      mountPath: /opt/render/project/src/media
      sizeGB: 1

  # Frontend React App
  - type: web
    name: civicai-frontend
    env: node
    buildCommand: |
      cd frontend
      npm ci
      npm run build
    startCommand: |
      cd frontend
      npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: VITE_API_URL
        value: https://civicai-backend.onrender.com
      - key: NODE_ENV
        value: production

  # Redis Cache
  - type: redis
    name: civicai-redis
    ipAllowList: []

databases:
  - name: civicai-db
    databaseName: civicai_production
    user: civicai_user